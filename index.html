<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111d36">
  <meta name="description" content="A little midnight flight. Tap or press space to keep the signal bird in the sky.">
  <title>Nightjar — A little midnight flight</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #111d36;
      --paper: #f5e7b9;
      --muted: rgba(245, 231, 185, .58);
      --glow: #f6bc76;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
    body { font-family: 'DM Sans', sans-serif; color: var(--paper); -webkit-tap-highlight-color: transparent; }

    .world {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 400px;
      overflow: hidden;
      isolation: isolate;
      background: #111d36;
      touch-action: manipulation;
      user-select: none;
    }

    .world::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .masthead, .score, .footer, .sound-toggle {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    .masthead { top: max(30px, env(safe-area-inset-top)); left: max(34px, env(safe-area-inset-left)); }
    .eyebrow, .footer, .score-label, .sound-toggle {
      font-family: 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: .17em;
    }
    .eyebrow { margin: 0 0 5px; color: var(--glow); font-size: 10px; }
    h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(23px, 3vw, 34px); font-weight: 500; letter-spacing: -.075em; line-height: 1; }
    h1 span { color: var(--glow); }

    .score { top: max(36px, env(safe-area-inset-top)); right: max(38px, env(safe-area-inset-right)); text-align: right; transition: transform .18s ease; }
    .score.pop { transform: scale(1.12); }
    .score-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 9px; }
    .score-number { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 36px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.08em; }
    .score-best { display: block; margin-top: 6px; color: rgba(245,231,185,.42); font: 9px 'DM Mono', monospace; letter-spacing: .12em; }

    .footer { bottom: max(27px, env(safe-area-inset-bottom)); left: 50%; display: flex; align-items: center; gap: 12px; transform: translateX(-50%); color: rgba(245,231,185,.46); font-size: 9px; white-space: nowrap; letter-spacing: .12em; }
    .keycap { display: inline-grid; place-items: center; width: 25px; height: 22px; border: 1px solid rgba(245,231,185,.25); border-radius: 5px; color: rgba(245,231,185,.75); font-family: 'DM Sans', sans-serif; font-size: 12px; letter-spacing: 0; }
    .footer .dot { width: 3px; height: 3px; border-radius: 100%; background: var(--glow); }

    .sound-toggle {
      top: max(37px, env(safe-area-inset-top)); right: max(116px, calc(env(safe-area-inset-right) + 116px));
      pointer-events: auto; border: 0; padding: 8px; background: transparent; color: rgba(245,231,185,.45); font-size: 9px; cursor: pointer;
    }
    .sound-toggle:hover { color: var(--paper); }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 600px) {
      .masthead { top: max(23px, env(safe-area-inset-top)); left: max(23px, env(safe-area-inset-left)); }
      .score { top: max(25px, env(safe-area-inset-top)); right: max(23px, env(safe-area-inset-right)); }
      .score-number { font-size: 30px; }
      .score-best { margin-top: 4px; font-size: 8px; }
      .sound-toggle { display: none; }
      .footer { bottom: max(21px, env(safe-area-inset-bottom)); font-size: 8px; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="world" id="world" aria-label="Nightjar flying game. Tap, click, or press space to flap. Avoid the dark towers.">
    <canvas id="sky" aria-hidden="true"></canvas>
    <header class="masthead" aria-hidden="true">
      <p class="eyebrow">A little midnight flight</p>
      <h1>NIGHT<span>JAR</span></h1>
    </header>
    <div class="score" id="scoreBox" aria-hidden="true">
      <span class="score-label">Flight score</span>
      <span class="score-number" id="score">00</span>
      <span class="score-best" id="bestScore">BEST&nbsp; 00</span>
    </div>
    <button class="sound-toggle" id="soundToggle" type="button" aria-label="Turn sound off">SOUND&nbsp; ON</button>
    <div class="footer" aria-hidden="true"><span class="keycap">SPACE</span><span class="dot"></span><span>TAP TO FLAP</span></div>
    <p class="sr-only" id="announcement" aria-live="polite">Ready to fly. Press space or tap.</p>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');
      const world = document.getElementById('world');
      const scoreEl = document.getElementById('score');
      const bestScoreEl = document.getElementById('bestScore');
      const scoreBox = document.getElementById('scoreBox');
      const announcement = document.getElementById('announcement');
      const soundToggle = document.getElementById('soundToggle');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const palette = {
        night: '#111d36', deep: '#182946', ridge: '#213754', ridge2: '#2b4058',
        cream: '#f5e7b9', glow: '#f6bc76', coral: '#e99370', rose: '#c86e72',
        cloud: '#7e8ba1', shadow: '#0b1528'
      };
      const PIPE_RIM = 13;
      const game = {
        state: 'ready', width: 0, height: 0, dpr: 1, time: 0, last: 0,
        score: 0, best: Number(localStorage.getItem('nightjar-best') || 0),
        speed: 190, maxSpeed: 350, gravity: 1800, flap: -540, gap: 178, pipeWidth: 76,
        bird: { x: 0, homeX: 0, vx: 0, y: 0, vy: 0, angle: 0, wing: 0, slidePipe: null, slideAxis: null, slideX: 0, slideY: 0, slideRim: null },
        pipes: [], fireflies: [], particles: [], stars: [], clouds: [], shake: 0,
        shadowX: -24, milestoneTimer: 0, milestoneText: '', popup: null,
        deathTimer: 0, sound: true, audio: null, lastFlap: 0
      };
      bestScoreEl.innerHTML = `BEST&nbsp; ${String(game.best).padStart(2, '0')}`;

      function resize() {
        const rect = world.getBoundingClientRect();
        game.dpr = Math.min(window.devicePixelRatio || 1, 2);
        game.width = rect.width; game.height = rect.height;
        canvas.width = Math.round(rect.width * game.dpr);
        canvas.height = Math.round(rect.height * game.dpr);
        ctx.setTransform(game.dpr, 0, 0, game.dpr, 0, 0);
        game.gap = Math.max(148, Math.min(190, game.height * .29));
        game.pipeWidth = Math.max(64, Math.min(82, game.width * .12));
        game.bird.homeX = game.width * (game.width < 600 ? .28 : .31);
        if (game.state !== 'running') {
          game.bird.x = game.bird.homeX;
          game.bird.y = game.height * .48;
          game.bird.vx = 0;
          game.shadowX = -24;
        }
        game.stars = Array.from({ length: Math.floor(game.width * game.height / 7200) }, (_, i) => ({
          x: Math.random() * game.width, y: Math.random() * game.height * .8,
          r: Math.random() * 1.2 + .35, a: Math.random() * .55 + .15, phase: Math.random() * 6.3
        }));
        game.clouds = Array.from({ length: 7 }, (_, i) => ({ x: i * game.width / 5 + Math.random() * 90, y: game.height * (.14 + Math.random() * .56), s: .55 + Math.random() * 1.1, layer: Math.random() }));
      }

      function setScore(value) {
        const previous = game.score;
        game.score = value;
        scoreEl.textContent = String(value).padStart(2, '0');
        if (value > game.best) {
          game.best = value;
          localStorage.setItem('nightjar-best', String(game.best));
        }
        bestScoreEl.innerHTML = `BEST&nbsp; ${String(game.best).padStart(2, '0')}`;
        const milestones = [[30, 'FIRST LIGHT'], [20, 'THE LONG NIGHT'], [10, 'INTO THE DEEP'], [5, 'FIVE BEACONS']];
        const reached = milestones.find(([mark]) => previous < mark && value >= mark);
        if (reached && game.state === 'running') {
          game.milestoneText = reached[1];
          game.milestoneTimer = 1.8;
          burst(game.bird.x, game.bird.y, 16, palette.glow);
          tone(540, .22, 'sine', .035, 360);
        }
        scoreBox.classList.remove('pop');
        void scoreBox.offsetWidth;
        scoreBox.classList.add('pop');
        setTimeout(() => scoreBox.classList.remove('pop'), 180);
      }

      function audioContext() {
        if (!game.audio) {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (Audio) game.audio = new Audio();
        }
        if (game.audio?.state === 'suspended') game.audio.resume();
        return game.audio;
      }

      function tone(freq, duration, type = 'sine', volume = .035, slide = 0) {
        if (!game.sound) return;
        const audio = audioContext();
        if (!audio) return;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(freq, audio.currentTime);
        if (slide) oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, freq + slide), audio.currentTime + duration);
        gain.gain.setValueAtTime(volume, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
        oscillator.connect(gain); gain.connect(audio.destination);
        oscillator.start(); oscillator.stop(audio.currentTime + duration);
      }

      function burst(x, y, amount, color) {
        for (let i = 0; i < amount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const force = 25 + Math.random() * 125;
          game.particles.push({ x, y, vx: Math.cos(angle) * force, vy: Math.sin(angle) * force - 20, life: .35 + Math.random() * .55, age: 0, size: 1.5 + Math.random() * 3, color });
        }
      }

      function addPipe(x = game.width + 30) {
        // Each beacon keeps the opening it was born with; only new beacons
        // tighten as the flight score rises.
        const gap = Math.max(58, game.gap - 52 - Math.min(game.score * 1.55, 78));
        const margin = Math.max(96, game.height * .18);
        const gapY = margin + gap / 2 + Math.random() * (game.height - margin * 2 - gap);
        game.pipes.push({ x, gapY, gap, passed: false, seed: Math.random() * 20 });
        if (Math.random() < .72) {
          game.fireflies.push({
            x: x - game.pipeWidth - 24,
            y: gapY + (Math.random() - .5) * gap * .38,
            phase: Math.random() * Math.PI * 2,
            collected: false
          });
        }
      }

      function startGame() {
        if (game.state === 'running') return;
        game.state = 'running'; game.deathTimer = 0; game.shake = 0;
        game.pipes = []; game.fireflies = []; game.particles = [];
        game.bird.x = game.bird.homeX; game.bird.vx = 0;
        game.bird.y = game.height * .48; game.bird.vy = 0; game.bird.angle = 0;
        game.bird.slidePipe = null; game.bird.slideAxis = null; game.bird.slideRim = null;
        game.shadowX = -24;
        game.milestoneTimer = 0; game.popup = null;
        game.lastFlap = 0;
        setScore(0);
        addPipe(game.width + 80);
        announcement.textContent = 'Flight started. Flap through the openings and catch fireflies for bonus points.';
        flap();
      }

      function flap() {
        if (game.state === 'ready' || game.state === 'dead') {
          if (game.state === 'dead' && game.deathTimer < .45) return;
          startGame(); return;
        }
        game.bird.vy = game.flap;
        if (game.bird.slideAxis === 'x') {
          game.bird.slidePipe = null;
          game.bird.slideAxis = null;
          game.bird.slideRim = null;
        }
        game.bird.wing = 1;
        game.lastFlap = game.time;
        burst(game.bird.x - 13, game.bird.y + 5, 5, palette.glow);
        tone(390, .085, 'triangle', .022, 140);
      }

      function die() {
        if (game.state !== 'running') return;
        game.state = 'dead'; game.deathTimer = 0; game.shake = .36;
        burst(game.bird.x, game.bird.y, 22, palette.coral);
        tone(210, .38, 'sawtooth', .045, -150);
        if (game.score > game.best) {
          game.best = game.score;
          localStorage.setItem('nightjar-best', String(game.best));
        }
        announcement.textContent = `Flight ended. Score ${game.score}. Best ${game.best}. Press space or tap to fly again.`;
      }

      function ellipseTouchesRect(cx, cy, rx, ry, left, top, right, bottom) {
        if (right <= left || bottom <= top) return false;
        const nearestX = Math.max(left, Math.min(cx, right));
        const nearestY = Math.max(top, Math.min(cy, bottom));
        const dx = (cx - nearestX) / rx;
        const dy = (cy - nearestY) / ry;
        return dx * dx + dy * dy < 1;
      }

      function update(dt) {
        game.time += dt;
        if (game.shake > 0) game.shake = Math.max(0, game.shake - dt);
        for (const p of game.particles) {
          p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
          p.vy += 150 * dt; p.vx *= Math.pow(.12, dt);
        }
        game.particles = game.particles.filter(p => p.age < p.life);

        if (game.state === 'dead') game.deathTimer += dt;
        if (game.state !== 'running') return;

        const b = game.bird;
        const speed = Math.min(game.maxSpeed, game.speed + game.score * 4.2);
        const shadowSpeed = Math.max(5, Math.min(14, game.width * .012)) + Math.min(game.score * .12, 5);
        game.shadowX += shadowSpeed * dt;
        for (const pipe of game.pipes) pipe.x -= speed * dt;

        const attachedPipe = b.slidePipe && game.pipes.includes(b.slidePipe) ? b.slidePipe : null;
        if (!attachedPipe && b.slidePipe) {
          b.slidePipe = null; b.slideAxis = null; b.slideRim = null;
        }
        b.slidePipe = attachedPipe;
        const horizontalSlide = attachedPipe && b.slideAxis === 'x';
        if (horizontalSlide) {
          b.x = b.slideX; b.y = b.slideY;
          b.vx = 0; b.vy = 0;
        } else if (attachedPipe) {
          // The pole travels from right to left, so the bird clings to its
          // near (left) face instead of being teleported through to the far side.
          b.x = attachedPipe.x - 22;
          b.vx = -speed;
        } else {
          // Keep the flight lane stable after a slide releases; snapping back
          // toward the old lane made the bird visibly surge forward.
          b.vx = 0;
        }
        if (!horizontalSlide) {
          b.vy += game.gravity * dt;
          b.vy = Math.min(b.vy, attachedPipe ? 38 : 720);
          b.y += b.vy * dt;
        }
        b.angle = Math.max(-.68, Math.min(1.12, b.vy / 540 + b.vx / 1500));
        b.wing = Math.max(0, b.wing - dt * 4.4);

        if (game.milestoneTimer > 0) game.milestoneTimer = Math.max(0, game.milestoneTimer - dt);
        if (game.popup) {
          game.popup.age += dt;
          if (game.popup.age > .9) game.popup = null;
        }
        for (const pipe of game.pipes) {
          const top = pipe.gapY - pipe.gap / 2;
          const bottom = pipe.gapY + pipe.gap / 2;
          const bx = b.x, by = b.y, r = 12, reach = 22;
          const right = pipe.x + game.pipeWidth;
          const shaftLeft = pipe.x + 4, shaftRight = right - 4;
          const rim = PIPE_RIM;
          // Match collision to the two stepped tower silhouettes: narrow shaft,
          // full-width rim, then the lower shaft. The ellipse avoids snagging on
          // empty corners while still including the bird's beak and body.
          const hitsUpperRim = ellipseTouchesRect(bx, by, reach, r, pipe.x, top - rim, right, top);
          const hitsLowerRim = ellipseTouchesRect(bx, by, reach, r, pipe.x, bottom, right, bottom + rim);
          const hitsShaft =
            ellipseTouchesRect(bx, by, reach, r, shaftLeft, 0, shaftRight, top - rim) ||
            ellipseTouchesRect(bx, by, reach, r, shaftLeft, bottom + rim, shaftRight, game.height);
          const overlapsPole = hitsUpperRim || hitsLowerRim || hitsShaft;
          if (b.slidePipe === pipe) {
            if (b.slideAxis === 'x') {
              const rimStillTouching = b.slideRim === 'upper' ? hitsUpperRim : hitsLowerRim;
              if (!rimStillTouching || right < -20) {
                b.slidePipe = null; b.slideAxis = null; b.slideRim = null; b.vx = 0;
              } else {
                b.x = b.slideX; b.y = b.slideY;
                b.vx = 0; b.vy = 0;
              }
            } else {
              const insideGap = by - r >= top && by + r <= bottom;
              if (insideGap || right < -20) {
                b.slidePipe = null; b.slideAxis = null; b.slideRim = null; b.vx = 0;
              } else {
                // Hold the bird against the pole's side until its body fits the gap.
                b.x = pipe.x - reach;
                b.vx = -speed;
              }
            }
          } else if (overlapsPole) {
            const firstBump = !pipe.bumped;
            pipe.bumped = true;
            b.slidePipe = pipe;
            if (hitsUpperRim || hitsLowerRim) {
              // Rims carry the bird sideways, just as the shaft carries it down.
              b.slideAxis = 'x';
              b.slideRim = hitsUpperRim ? 'upper' : 'lower';
              b.slideX = bx;
              const inset = 1; // keep a tiny overlap so contact remains stable between frames
              b.slideY = hitsUpperRim
                ? (by < top - rim / 2 ? top - rim - r + inset : top + r - inset)
                : (by > bottom + rim / 2 ? bottom + rim + r - inset : bottom - r + inset);
              b.x = b.slideX; b.y = b.slideY;
              b.vx = 0; b.vy = 0;
            } else {
              b.slideAxis = 'y'; b.slideRim = null;
              b.x = pipe.x - reach;
              b.vx = -speed;
              // Keep a flap's upward impulse even on the contact frame; only
              // soften downward motion into the slow pole slide.
              if (b.vy >= 0) b.vy = Math.max(22, Math.min(b.vy, 38));
            }
            if (firstBump) {
              b.wing = 1;
              burst(b.x, b.y, 10, palette.coral);
              tone(165, .12, 'triangle', .035, -70);
            }
          }
          if (!pipe.passed && b.slidePipe !== pipe && pipe.x + game.pipeWidth < b.x - r) {
            pipe.passed = true; setScore(game.score + 1); tone(700, .12, 'sine', .035, 400);
          }
        }
        for (const fly of game.fireflies) {
          fly.x -= speed * dt;
          fly.phase += dt * 5;
          if (Math.hypot(b.x - fly.x, b.y - fly.y) < 23) {
            fly.collected = true;
            setScore(game.score + 1);
            const shadowRecoil = Math.min(80, Math.max(48, game.width * .075));
            game.shadowX = Math.max(-24, game.shadowX - shadowRecoil);
            burst(fly.x, fly.y, 13, palette.glow);
            game.popup = { x: fly.x, y: fly.y - 8, age: 0 };
            tone(820, .16, 'sine', .04, 420);
          }
        }
        game.fireflies = game.fireflies.filter(fly => !fly.collected && fly.x > -28);
        game.pipes = game.pipes.filter(p => p.x + game.pipeWidth > -20);
        const spacing = game.width < 600
          ? Math.max(140, game.width * .46 - Math.min(game.score * .35, 18))
          : 270 - Math.min(game.score * 1.2, 55);
        if (!game.pipes.length || game.pipes[game.pipes.length - 1].x < game.width - spacing) addPipe();
        if (b.y - 12 < 0 || b.y + 12 > game.height || b.x - 12 <= shadowFrontAt(b.y)) die();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
      }

      function drawBackground() {
        const { width: w, height: h } = game;
        const dawn = Math.min(1, game.score / 32);
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, blendColor('#121e38', '#44334b', dawn * .72));
        sky.addColorStop(.55, blendColor('#263a56', '#995b70', dawn * .7));
        sky.addColorStop(1, blendColor('#465066', '#e59b79', dawn * .88));
        ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);

        if (dawn > 0) {
          const sunX = w * .58, sunY = h * .75, sunR = Math.min(w, h) * .085;
          ctx.save(); ctx.globalAlpha = dawn * .72;
          const sunrise = ctx.createRadialGradient(sunX, sunY, sunR * .2, sunX, sunY, sunR * 3.4);
          sunrise.addColorStop(0, 'rgba(255,190,137,.34)'); sunrise.addColorStop(1, 'rgba(255,156,125,0)');
          ctx.fillStyle = sunrise; ctx.fillRect(sunX - sunR * 3.5, sunY - sunR * 3.5, sunR * 7, sunR * 7);
          ctx.fillStyle = '#f1b17d'; ctx.beginPath(); ctx.arc(sunX, sunY, sunR * .64, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        const moonX = w * .76, moonY = h * .24, moonR = Math.min(w, h) * .105;
        ctx.save(); ctx.globalAlpha = 1 - dawn * .68;
        const halo = ctx.createRadialGradient(moonX, moonY, moonR * .2, moonX, moonY, moonR * 2.9);
        halo.addColorStop(0, 'rgba(246,188,118,.17)'); halo.addColorStop(1, 'rgba(246,188,118,0)');
        ctx.fillStyle = halo; ctx.fillRect(moonX - moonR * 3, moonY - moonR * 3, moonR * 6, moonR * 6);
        ctx.fillStyle = '#f4d9a1'; ctx.beginPath(); ctx.arc(moonX, moonY, moonR * .63, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d9b988'; ctx.beginPath(); ctx.arc(moonX + moonR * .22, moonY - moonR * .2, moonR * .58, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        for (const star of game.stars) {
          const twinkle = .7 + Math.sin(game.time * 1.4 + star.phase) * .3;
          ctx.globalAlpha = star.a * twinkle * (1 - dawn * .78);
          ctx.fillStyle = '#f5e7b9'; ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const cloud of game.clouds) {
          const offset = game.state === 'running' ? game.time * (8 + cloud.layer * 13) : Math.sin(game.time * .16 + cloud.x) * 7;
          const x = ((cloud.x - offset) % (w + 250) + (w + 250)) % (w + 250) - 120;
          drawCloud(x, cloud.y, cloud.s, cloud.layer);
        }

        drawRidge(h * .74, '#2b4058', .12, 26);
        drawRidge(h * .83, '#213650', .2, 15);
        drawRidge(h * .92, '#182b46', .28, 7);
        const mist = ctx.createLinearGradient(0, h * .66, 0, h);
        mist.addColorStop(0, 'rgba(203,170,151,0)'); mist.addColorStop(1, 'rgba(203,170,151,.11)');
        ctx.fillStyle = mist; ctx.fillRect(0, h * .6, w, h * .4);
      }

      function blendColor(from, to, amount) {
        const a = [parseInt(from.slice(1, 3), 16), parseInt(from.slice(3, 5), 16), parseInt(from.slice(5, 7), 16)];
        const b = [parseInt(to.slice(1, 3), 16), parseInt(to.slice(3, 5), 16), parseInt(to.slice(5, 7), 16)];
        return `rgb(${a.map((channel, i) => Math.round(channel + (b[i] - channel) * amount)).join(',')})`;
      }

      function drawCloud(x, y, scale, layer) {
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
        ctx.globalAlpha = .08 + layer * .08; ctx.fillStyle = '#cfced0';
        ctx.beginPath(); ctx.ellipse(0, 0, 45, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-21, -2, 18, 7, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(8, -5, 25, 12, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.restore(); ctx.globalAlpha = 1;
      }

      function drawRidge(base, color, parallax, detail) {
        const w = game.width, h = game.height;
        ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, h);
        const currentSpeed = Math.min(game.maxSpeed, game.speed + game.score * 4.2);
        const shift = game.state === 'running' ? (game.time * currentSpeed * parallax) % 260 : 0;
        for (let x = -280 - shift; x < w + 280; x += 130) {
          const peak = base - (25 + Math.abs(Math.sin(x * .016 + detail) * detail));
          ctx.lineTo(x, base + 80); ctx.lineTo(x + 65, peak); ctx.lineTo(x + 130, base + 80);
        }
        ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
      }

      function drawTower(pipe) {
        // Snap the moving masonry to physical pixels so its narrow rims don't
        // shimmer or split into sub-pixel seams as the towers scroll by.
        const pixel = value => Math.round(value * game.dpr) / game.dpr;
        const x = pixel(pipe.x), top = pixel(pipe.gapY - pipe.gap / 2);
        const bottom = pixel(pipe.gapY + pipe.gap / 2), pw = pixel(game.pipeWidth);
        const cap = pixel(PIPE_RIM);
        // The towers feel like old signal beacons cut from the ridge.
        const towerGradient = ctx.createLinearGradient(x, 0, x + pw, 0);
        towerGradient.addColorStop(0, '#182b45'); towerGradient.addColorStop(.18, '#293e56');
        towerGradient.addColorStop(.76, '#233852'); towerGradient.addColorStop(1, '#14243c');
        ctx.fillStyle = towerGradient;
        // Build each tower and its overhanging rim as a single silhouette;
        // separate touching rectangles can leave flickering seams while scrolling.
        ctx.beginPath();
        ctx.moveTo(x + 4, 0); ctx.lineTo(x + pw - 4, 0);
        ctx.lineTo(x + pw - 4, top - cap); ctx.lineTo(x + pw, top - cap);
        ctx.lineTo(x + pw, top); ctx.lineTo(x, top);
        ctx.lineTo(x, top - cap); ctx.lineTo(x + 4, top - cap);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x, bottom); ctx.lineTo(x + pw, bottom);
        ctx.lineTo(x + pw, bottom + cap); ctx.lineTo(x + pw - 4, bottom + cap);
        ctx.lineTo(x + pw - 4, game.height); ctx.lineTo(x + 4, game.height);
        ctx.lineTo(x + 4, bottom + cap); ctx.lineTo(x, bottom + cap);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(246,188,118,.34)';
        ctx.fillRect(x + 1, top - cap + 1, 2, cap - 2);
        ctx.fillRect(x + 1, bottom + cap - 3, 2, 2);
        ctx.fillStyle = 'rgba(8,18,34,.5)';
        ctx.fillRect(x, top - 2, pw, 2);
        ctx.fillRect(x, bottom, pw, 2);
        ctx.fillStyle = '#e9ad79';
        ctx.fillRect(x + pw * .5 - 2, top - cap + 4, 4, 3);
        ctx.fillRect(x + pw * .5 - 2, bottom + 5, 4, 3);

        // Recessed windows disappear into the upper and lower stone.
        const step = 43;
        const first = Math.max(18, top - 58);
        for (let y = first; y < top - 24; y += step) drawWindow(x + pw * .5, y, pipe.seed + y);
        for (let y = bottom + 33; y < game.height - 18; y += step) drawWindow(x + pw * .5, y, pipe.seed + y);

        // Tiny chipped edges give the passage an irregular, carved silhouette.
        ctx.fillStyle = '#1d304b';
        for (let y = 26; y < top - 20; y += 76) ctx.fillRect(x + 7 + ((y / 76 | 0) % 2) * 4, y, 3, 8);
        for (let y = bottom + 25; y < game.height - 24; y += 76) ctx.fillRect(x + 8 + ((y / 76 | 0) % 2) * 5, y, 3, 8);
      }

      function drawFirefly(fly) {
        const bob = Math.sin(fly.phase) * 4;
        const x = fly.x, y = fly.y + bob;
        const pulse = .75 + Math.sin(fly.phase * .8) * .2;
        const glow = ctx.createRadialGradient(x, y, 1, x, y, 22 * pulse);
        glow.addColorStop(0, 'rgba(255,218,139,.62)'); glow.addColorStop(1, 'rgba(255,190,110,0)');
        ctx.fillStyle = glow; ctx.fillRect(x - 24, y - 24, 48, 48);
        ctx.fillStyle = '#ffe7a5'; ctx.beginPath(); ctx.arc(x, y, 3.2 * pulse, 0, Math.PI * 2); ctx.fill();
      }

      function shadowFrontAt(y) {
        return game.shadowX + Math.sin(y * .018 + game.time * 1.1) * 9 + Math.sin(y * .041 - game.time * .7) * 4;
      }

      function drawCreepingShadow() {
        if (game.shadowX < -42) return;
        const w = game.width, h = game.height;
        const shade = ctx.createLinearGradient(0, 0, Math.max(1, game.shadowX + 100), 0);
        shade.addColorStop(0, 'rgba(9,12,28,.96)');
        shade.addColorStop(.7, 'rgba(15,14,34,.88)');
        shade.addColorStop(1, 'rgba(25,18,42,0)');
        ctx.beginPath(); ctx.moveTo(0, 0);
        for (let y = 0; y <= h + 16; y += 16) ctx.lineTo(shadowFrontAt(y), y);
        ctx.lineTo(0, h); ctx.closePath(); ctx.fillStyle = shade; ctx.fill();

        ctx.save();
        ctx.strokeStyle = 'rgba(70,55,91,.72)'; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let y = 0; y <= h + 16; y += 16) {
          const x = shadowFrontAt(y) + 2 + Math.sin(game.time * 2 + y * .025) * 2;
          if (y === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = .42;
        for (let y = 28; y < h; y += 76) {
          const front = shadowFrontAt(y);
          const reach = 18 + Math.sin(game.time * 1.8 + y) * 8;
          ctx.beginPath(); ctx.moveTo(front - 10, y - 9);
          ctx.quadraticCurveTo(front + reach, y - 2, front - 1, y + 6);
          ctx.quadraticCurveTo(front - 14, y + 12, front - 8, y + 21);
          ctx.fillStyle = '#171629'; ctx.fill();
        }
        ctx.restore();
      }

      function drawFeedback() {
        if (game.milestoneTimer > 0) {
          const alpha = Math.min(1, game.milestoneTimer * 1.5);
          ctx.save(); ctx.globalAlpha = alpha; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(246,188,118,.92)';
          ctx.font = `500 ${Math.min(14, Math.max(10, game.width * .018))}px 'DM Mono', monospace`;
          ctx.letterSpacing = '.24em'; ctx.fillText(game.milestoneText, game.width / 2, game.height * .22);
          ctx.restore();
        }
        if (game.popup) {
          const alpha = Math.max(0, 1 - game.popup.age / .9);
          ctx.save(); ctx.globalAlpha = alpha; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffe7a5'; ctx.font = "500 10px 'DM Mono', monospace"; ctx.letterSpacing = '.1em';
          ctx.fillText('+1 FIREFLY', game.popup.x, game.popup.y - game.popup.age * 24);
          ctx.restore();
        }
      }

      function drawWindow(x, y, seed) {
        ctx.fillStyle = '#101c31';
        roundRect(x - 4, y - 7, 8, 15, 4); ctx.fill();
        if (Math.sin(seed) > .12) {
          const glow = ctx.createRadialGradient(x, y, 0, x, y, 13);
          glow.addColorStop(0, 'rgba(246,188,118,.28)'); glow.addColorStop(1, 'rgba(246,188,118,0)');
          ctx.fillStyle = glow; ctx.fillRect(x - 14, y - 14, 28, 28);
          ctx.fillStyle = 'rgba(246,188,118,.68)'; roundRect(x - 1.5, y - 4, 3, 9, 2); ctx.fill();
        }
      }

      function drawBird() {
        const b = game.bird;
        const wingAngle = Math.sin(game.time * 18) * .32 - b.wing * .7;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.angle);
        // Tail feathers
        ctx.fillStyle = '#e79570';
        ctx.beginPath(); ctx.moveTo(-13, 1); ctx.lineTo(-23, -4); ctx.lineTo(-20, 2); ctx.lineTo(-25, 7); ctx.lineTo(-12, 7); ctx.closePath(); ctx.fill();
        // Body
        ctx.fillStyle = '#f2d69a'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 11.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e6b779'; ctx.beginPath(); ctx.ellipse(-3, 5, 9, 4, -.15, 0, Math.PI * 2); ctx.fill();
        // Wing
        ctx.save(); ctx.translate(-2, -2); ctx.rotate(wingAngle);
        ctx.fillStyle = '#e99370'; ctx.beginPath(); ctx.ellipse(-1, -4, 10, 5.8, -.12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(111,56,58,.42)'; ctx.lineWidth = .8;
        ctx.beginPath(); ctx.moveTo(-8, -4); ctx.quadraticCurveTo(-1, -5, 5, -4); ctx.stroke();
        ctx.restore();
        // Beak and eye
        ctx.fillStyle = '#d8795f'; ctx.beginPath(); ctx.moveTo(12, -1); ctx.lineTo(22, 2); ctx.lineTo(12, 5); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#18243b'; ctx.beginPath(); ctx.arc(7, -4, 1.45, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(7.35, -4.4, .48, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawParticles() {
        for (const p of game.particles) {
          const alpha = Math.max(0, 1 - p.age / p.life);
          ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawCue(text, subtext, y, accent = false) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = accent ? palette.glow : palette.cream;
        ctx.font = `500 ${Math.min(15, Math.max(11, game.width * .018))}px 'DM Mono', monospace`;
        ctx.letterSpacing = '0.16em'; ctx.fillText(text, game.width / 2, y);
        ctx.fillStyle = 'rgba(245,231,185,.56)'; ctx.font = `400 ${Math.min(12, Math.max(10, game.width * .014))}px 'DM Sans', sans-serif`;
        ctx.letterSpacing = '0.02em'; ctx.fillText(subtext, game.width / 2, y + 28);
        ctx.letterSpacing = '0px';
      }

      function drawIntro() {
        const w = game.width, h = game.height;
        const centerY = h * .58;
        ctx.save();
        const pulse = reducedMotion ? 1 : .94 + Math.sin(game.time * 2.4) * .025;
        ctx.translate(w / 2, centerY - 50); ctx.scale(pulse, pulse);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(246,188,118,.82)'; ctx.font = `500 ${Math.min(13, w * .017)}px 'DM Mono', monospace`; ctx.letterSpacing = '.25em';
        ctx.fillText('THE BEACONS ARE LIT', 0, -42);
        ctx.fillStyle = '#f5e7b9'; ctx.font = `500 ${Math.min(78, Math.max(30, w * .075))}px 'Space Grotesk', 'Avenir Next', sans-serif`; ctx.letterSpacing = '-.065em';
        ctx.fillText('Stay between', 0, 4);
        ctx.fillText('the lights.', 0, 58);
        ctx.restore(); ctx.letterSpacing = '0px';
        drawCue('PRESS SPACE OR TAP', 'flap through the lights · catch fireflies', centerY + 65, true);
        ctx.fillStyle = 'rgba(245,231,185,.35)'; ctx.font = "10px 'DM Mono', monospace"; ctx.textAlign = 'center'; ctx.letterSpacing = '.12em';
        ctx.fillText(`BEST FLIGHT   ${String(game.best).padStart(2, '0')}`, w / 2, h * .82);
        ctx.letterSpacing = '0px';
      }

      function drawGameOver() {
        if (game.deathTimer < .35) return;
        const alpha = Math.min(1, (game.deathTimer - .35) * 2.2);
        ctx.save(); ctx.globalAlpha = alpha;
        const y = game.height * .5;
        const shade = ctx.createLinearGradient(0, y - 112, 0, y + 145);
        shade.addColorStop(0, 'rgba(14,23,42,0)'); shade.addColorStop(.25, 'rgba(14,23,42,.45)'); shade.addColorStop(.76, 'rgba(14,23,42,.45)'); shade.addColorStop(1, 'rgba(14,23,42,0)');
        ctx.fillStyle = shade; ctx.fillRect(0, y - 120, game.width, 280);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = palette.coral; ctx.font = "500 11px 'DM Mono', monospace"; ctx.letterSpacing = '.22em';
        ctx.fillText('FLIGHT ENDED', game.width / 2, y - 58);
        ctx.fillStyle = palette.cream; ctx.font = `500 ${Math.min(46, game.width * .09)}px 'Space Grotesk', sans-serif`; ctx.letterSpacing = '-.07em';
        ctx.fillText(String(game.score).padStart(2, '0'), game.width / 2, y - 6);
        ctx.fillStyle = 'rgba(245,231,185,.55)'; ctx.font = "10px 'DM Mono', monospace"; ctx.letterSpacing = '.15em';
        ctx.fillText(`BEST  ${String(game.best).padStart(2, '0')}`, game.width / 2, y + 33);
        drawCue('TAP TO TAKE FLIGHT AGAIN', 'the night is still young', y + 82, true);
        ctx.restore(); ctx.letterSpacing = '0px';
      }

      function render() {
        const { width: w, height: h } = game;
        if (!w || !h) return;
        ctx.save();
        if (game.shake > 0 && !reducedMotion) {
          const intensity = game.shake * 13;
          ctx.translate((Math.random() - .5) * intensity, (Math.random() - .5) * intensity);
        }
        drawBackground();
        drawCreepingShadow();
        drawBird();
        for (const pipe of game.pipes) drawTower(pipe);
        for (const fly of game.fireflies) drawFirefly(fly);
        drawParticles();
        drawFeedback();
        if (game.state === 'ready') drawIntro();
        if (game.state === 'dead') drawGameOver();
        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min(.033, game.last ? (now - game.last) / 1000 : 0);
        game.last = now; update(dt); render(); requestAnimationFrame(loop);
      }

      function handleKey(event) {
        if (event.code === 'Space' || event.code === 'ArrowUp') {
          event.preventDefault();
          if (!event.repeat) flap();
        }
      }

      window.addEventListener('keydown', handleKey);
      world.addEventListener('pointerdown', event => {
        if (event.target === soundToggle) return;
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        flap();
      });
      soundToggle.addEventListener('click', () => {
        game.sound = !game.sound;
        soundToggle.innerHTML = `SOUND&nbsp; ${game.sound ? 'ON' : 'OFF'}`;
        soundToggle.setAttribute('aria-label', `Turn sound ${game.sound ? 'off' : 'on'}`);
        if (game.sound) tone(560, .1);
      });
      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => { game.last = 0; });
      resize(); requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
